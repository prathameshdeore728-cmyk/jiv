<!DOCTYPE html>
<html>
<head>
    <title>Street Scene</title>
<style>
    .signal {
        background-color: black;
        width: 60px;
        padding: 5px;
    }
    .light {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 5px;
    }
    .red {
        background-color: red;
        animation: red 6s infinite;
    }
    .yellow {
        background-color: yellow;
        animation: yellow 6s infinite;
    }
    .green {
        background-color: green;
        animation: green 6s infinite;
    }
    @keyframes red {
        0%, 33% { opacity: 1; }
        34%, 100% { opacity: 0.3; }
    }
    @keyframes yellow {
        0%, 33% { opacity: 0.3; }
        34%, 66% { opacity: 1; }
        67%, 100% { opacity: 0.3; }
    }
    @keyframes green {
        0%, 66% { opacity: 0.3; }
        67%, 100% { opacity: 1; }
    }
    .road {
        background-color: gray;
        height: 100px;
    }
    .car {
        background-color: blue;
        width: 100px;
        height: 40px;
        position: relative;
        animation: move 6s infinite;
    }
    .wheel {
        background-color: black;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-block;
    }
    @keyframes move {
    0%, 66% { left: 0px; }
    100% { left: 400px; }
    }
</style>
</head>
<body>
<h2>Street Scene</h2>
<div class="signal">
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
</div>
<div class="road">
    <div class="car">
        <div class="wheel"></div>
        <div class="wheel"></div>
    </div>
</div>
</body>
</html>
